<style>
@font-face{font-family:Geist;font-style:normal;font-weight:400;font-display:swap;src:url(fonts/geist-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Geist;font-style:normal;font-weight:500;font-display:swap;src:url(fonts/geist-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Geist;font-style:normal;font-weight:600;font-display:swap;src:url(fonts/geist-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Geist;font-style:normal;font-weight:700;font-display:swap;src:url(fonts/geist-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Geist Mono";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/geist-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Geist Mono";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/geist-mono-latin-500-normal.woff2) format("woff2")}
:root{--ease:cubic-bezier(.32,.72,0,1);--ease-out:cubic-bezier(.16,1,.3,1);--acc:#6C5CE7;
  --t-cache:#6C5CE7;--t-fresh:#0E9F8E;--t-input:#B04FD8;--t-out:#E0731C;--t-agents:#2F7BE5;--rv-h:0px;
  --ink:#17152B;--muted:#55536B;--teal:#2F7D84;--indigo:#2B3473;--sun:#FFC850}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:Geist,ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink)}
img,svg{display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
code,.mono{font-family:"Geist Mono",ui-monospace,monospace}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:8px}
.ic{width:18px;height:18px;fill:currentColor;flex:none}

/* ===== site base ===== */
.site{padding-top:var(--rv-h);overflow-x:clip;background:var(--bg,#F4F4F7)}
.wrap{width:min(1200px,100% - 48px);margin-inline:auto}
@media (max-width:767px){.wrap{width:calc(100% - 32px)}}
.rev{opacity:0;transform:translateY(28px);filter:blur(6px);transition:opacity .9s var(--ease-out),transform .9s var(--ease-out),filter .9s var(--ease-out)}
.rev.in{opacity:1;transform:none;filter:none}
@media (prefers-reduced-motion:reduce){.rev{opacity:1;transform:none;filter:none;transition:none}*{animation:none!important;transition:none!important}}
section{padding:120px 0;position:relative}
.eyebrow{display:inline-flex;align-items:center;gap:8px;border-radius:99px;padding:5px 12px;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;background:#fff;color:#4E4C63;box-shadow:0 0 0 1px rgba(23,21,43,.07)}
h1{font-size:clamp(42px,6.6vw,88px);line-height:.98;letter-spacing:-.045em;font-weight:600;text-wrap:balance}
h2{font-size:clamp(32px,4vw,56px);letter-spacing:-.04em;line-height:1.02;font-weight:600;text-wrap:balance}
.lead{font-size:clamp(17px,1.4vw,19px);line-height:1.6;color:var(--muted);text-wrap:pretty}
.sh{display:flex;flex-direction:column;align-items:flex-start;gap:16px;margin-bottom:52px}
.sh.c{align-items:center;text-align:center}
.sh .lead{max-width:600px}
.pill{display:inline-flex;align-items:center;gap:12px;padding:7px 7px 7px 22px;border-radius:99px;font-weight:500;font-size:15.5px;white-space:nowrap;transition:transform .5s var(--ease)}
.pill:active{transform:scale(.98)}
.pill .ci{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;transition:transform .5s var(--ease)}
.pill:hover .ci{transform:translate(2px,-1px) scale(1.05)}
.pill.pri{background:var(--ink);color:#fff}.pill.pri .ci{background:rgba(255,255,255,.14)}
.pill.ghost{background:#fff;color:var(--ink);box-shadow:0 0 0 1px rgba(23,21,43,.08)}.pill.ghost .ci{background:#F0EFF5}
.cmd{background:#fff;color:var(--ink);box-shadow:0 0 0 1px rgba(23,21,43,.08)}
.cmd .ci{background:#F0EFF5}
code.in{font-size:.92em;background:#EEEDF3;padding:1px 6px;border-radius:6px}
.shell{padding:6px;border-radius:30px;background:rgba(23,21,43,.035);box-shadow:0 0 0 1px rgba(23,21,43,.05)}
.core{height:100%;border-radius:24px;background:#fff;box-shadow:inset 0 1px 1px rgba(255,255,255,.9),0 1px 2px rgba(23,21,43,.04);padding:28px;overflow:hidden}

/* ---------- Shared component tokens ---------- */
.k-light{--k-bg:#FFFFFF;--k-sub:#F4F4F6;--k-line:#E8E8EC;--k-fg:#17152B;--k-fg2:#4E4C63;--k-fg3:#6B6980;--k-acc:#6C5CE7;--k-acc-soft:#EFEDFD;--k-acc-t:#5546D6;--k-code:#0B7A6D;--k-ok:#0F7F45;--k-warn:#9A5E00;--k-shadow:0 1px 2px rgba(23,21,43,.04),0 12px 32px -12px rgba(23,21,43,.14)}
.k-dark{--k-bg:#1B1930;--k-sub:#14122A;--k-line:rgba(255,255,255,.08);--k-fg:#F3F2FA;--k-fg2:#C2BEE6;--k-fg3:#9893C2;--k-acc:#8F82FF;--k-acc-soft:#272447;--k-acc-t:#C9C3FF;--k-code:#4FD1C0;--k-ok:#3DD68C;--k-warn:#F2B544;--k-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 30px 60px -24px rgba(0,0,0,.7)}

/* menu bar strip */
.k-mbar{height:28px;display:flex;align-items:center;gap:18px;padding:0 14px;font-size:12.5px;color:#fff;background:rgba(20,20,40,.28);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.k-mbar .l{display:flex;gap:16px;align-items:center;white-space:nowrap}.k-mbar .r{white-space:nowrap}@media (max-width:600px){.k-mbar .l span{display:none}.k-mbar{gap:10px;font-size:11.5px}.k-mbar .r{gap:10px}}.k-mbar .l b{font-weight:600}
.k-mbar .r{margin-left:auto;display:flex;gap:14px;align-items:center}
.k-mbar .tk{display:flex;align-items:center;gap:6px;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.22);font-weight:500;font-variant-numeric:tabular-nums}
.k-mbar .tk img{width:15px;height:15px;border-radius:4px}
.k-mbar .bat{width:22px;height:11px;border:1.2px solid rgba(255,255,255,.85);border-radius:3px;position:relative}
.k-mbar .bat::after{content:"";position:absolute;inset:1.5px;right:6px;background:#fff;border-radius:1px}
.k-mbar .dim{opacity:.9}

/* panel */
.k-panel{width:330px;max-width:100%;background:var(--k-bg);color:var(--k-fg);border-radius:18px;padding:14px;box-shadow:var(--k-shadow);border:1px solid var(--k-line);font-size:12.5px}
.kp-head{display:flex;align-items:center;gap:10px}
.kp-head img{width:30px;height:30px;border-radius:8px}
.kp-big{font-size:20px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kp-big small{font-size:12px;font-weight:500;color:var(--k-fg2);margin-left:3px}
.kp-cap{font-size:11.5px;color:var(--k-fg3)}
.kp-rate{margin-left:auto;font-size:12px;font-weight:600;color:var(--k-acc-t);background:var(--k-acc-soft);padding:4px 8px;border-radius:8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kp-now{margin-top:12px;background:var(--k-sub);border-radius:12px;padding:10px 11px}
.kp-now .h{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--k-fg2)}
.kp-now .h .p{margin-left:auto;font-weight:500;letter-spacing:0;color:var(--k-fg3)}
.kp-step{margin-top:6px;font-size:12px;color:var(--k-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp-step code{font-size:11px;background:var(--k-bg);border:1px solid var(--k-line);padding:1px 5px;border-radius:5px;margin-right:6px;color:var(--k-code)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--k-ok);flex:none}
.dot.w{background:var(--k-warn)}.dot.i{background:var(--k-fg3);opacity:.6}
.dot.pulse{box-shadow:0 0 0 0 color-mix(in srgb,var(--k-ok) 60%,transparent);animation:pulse 1.8s var(--ease-out) infinite}
@keyframes pulse{to{box-shadow:0 0 0 7px transparent}}
.kp-lim{margin-top:12px;display:grid;gap:9px}
.kp-lim .row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--k-fg2);margin-bottom:4px}
.kp-lim .row b{color:var(--k-fg);font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:color-mix(in srgb,var(--k-fg) 7%,transparent);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--k-acc)}
.kp-pace{margin-top:9px;font-size:11.5px;color:var(--k-ok);display:flex;gap:6px;align-items:center}
.kp-chart{margin-top:12px;height:46px;display:flex;align-items:flex-end;gap:2px}
.kp-chart span{flex:1;display:flex;flex-direction:column-reverse;border-radius:2px;overflow:hidden;min-height:2px}
.kp-chart span i{display:block}
.kp-cap2{font-size:10.5px;color:var(--k-fg3);margin-top:5px;display:flex;justify-content:space-between}
.kp-list{margin-top:10px;border-top:1px solid var(--k-line);padding-top:8px;display:grid;gap:2px}
.kp-list .it{display:flex;align-items:center;gap:8px;padding:5px 2px}
.kp-list .it .n{font-weight:500}
.kp-list .it .s{color:var(--k-fg3);font-size:11px}
.kp-list .it .v{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--k-fg2)}

/* toast */
.k-toast{width:340px;max-width:100%;display:flex;gap:11px;padding:12px 13px;border-radius:18px;background:color-mix(in srgb,var(--k-bg) 88%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--k-line);box-shadow:var(--k-shadow);color:var(--k-fg);font-size:12.5px}
.k-toast img{width:34px;height:34px;border-radius:9px;flex:none}
.k-toast .a{display:flex;font-size:10.5px;letter-spacing:.05em;color:var(--k-fg3);font-weight:500}
.k-toast .a span:last-child{margin-left:auto;letter-spacing:0}
.k-toast .t{font-weight:600;margin-top:2px}
.k-toast .b{color:var(--k-fg2);margin-top:1px;line-height:1.4}

/* map */
.k-map{container-type:inline-size;position:relative;background:var(--k-bg);border:1px solid var(--k-line);border-radius:18px;box-shadow:var(--k-shadow);color:var(--k-fg);overflow:hidden}
.k-map .top{white-space:nowrap;display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--k-line);font-size:12px;color:var(--k-fg2)}
.k-map .top b{color:var(--k-fg);font-weight:600}
.k-map .top .pgr{margin-left:auto;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.k-map .top .pgr span{width:22px;height:22px;border-radius:6px;background:var(--k-sub);display:grid;place-items:center}
.k-map .cv{background-image:radial-gradient(color-mix(in srgb,var(--k-fg) 10%,transparent) 1px,transparent 1px);background-size:16px 16px;padding:8px 6px}
.k-map svg text{font-family:Geist,sans-serif}
.k-map .node{fill:var(--k-bg);stroke:var(--k-line)}
.k-map .sel{stroke:var(--k-acc);stroke-width:2}
.k-map .t1{fill:var(--k-fg3);font-size:10px;font-weight:500;letter-spacing:.04em}
.k-map .t2{fill:var(--k-fg);font-size:12.5px;font-weight:600}
.k-map .t3{fill:var(--k-fg2);font-size:11px}
.k-map .wire{fill:none;stroke:color-mix(in srgb,var(--k-fg) 22%,transparent);stroke-width:1.5}
.k-map .wire.live{stroke:var(--k-acc);stroke-dasharray:4 5;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-18}}
.k-map .det{position:absolute;left:12px;bottom:12px;width:214px;background:var(--k-bg);border:1px solid var(--k-line);border-radius:14px;padding:10px 11px;box-shadow:var(--k-shadow);font-size:11.5px}
.k-map .det .mtabs{display:flex;gap:4px;margin:7px 0 8px}
.k-map .det .mtabs span{padding:3px 7px;white-space:nowrap;border-radius:7px;color:var(--k-fg2);background:var(--k-sub)}
.k-map .det .mtabs span.on{background:var(--k-acc-soft);color:var(--k-acc-t);font-weight:600}
.k-map .det .kv{display:flex;justify-content:space-between;padding:3px 0;color:var(--k-fg2)}
.k-map .det .kv b{color:var(--k-fg);font-weight:600;font-variant-numeric:tabular-nums}
@container (max-width:520px){.k-map .det{position:static;width:auto;margin:0 10px 10px;box-shadow:none}.k-map .top .prj{display:none}}
.k-map .det .f{font-family:"Geist Mono",monospace;font-size:11px;color:var(--k-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* savings */
.k-sav{background:var(--k-bg);border:1px solid var(--k-line);border-radius:18px;padding:14px;box-shadow:var(--k-shadow);color:var(--k-fg);font-size:12.5px}
.k-sav .h{font-size:10.5px;letter-spacing:.07em;font-weight:600;color:var(--k-fg3)}
.k-sav .nums{display:flex;gap:18px;margin-top:10px}
.k-sav .nums div{display:grid}
.k-sav .nums span{font-size:11px;color:var(--k-fg3)}
.k-sav .nums b{font-size:20px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.k-sav .nums .w b{color:var(--t-out)}
.k-sav .split{display:flex;height:8px;border-radius:99px;overflow:hidden;margin-top:10px;gap:2px}
.k-sav .rs{margin-top:12px;display:grid;gap:9px}
.k-sav .r .l{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.k-sav .r .l .v{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--k-fg2)}
.k-sav .r .bar i{background:var(--t-out)}
.bdg{font-size:10px;padding:1px 6px;border-radius:99px;border:1px dashed color-mix(in srgb,var(--k-fg) 30%,transparent);color:var(--k-fg3)}
.bdg.m{border-style:solid;border-color:transparent;background:color-mix(in srgb,var(--k-ok) 14%,transparent);color:var(--k-ok)}
.k-sav .btn{margin-top:13px;display:flex;align-items:center;justify-content:center;gap:6px;height:32px;border-radius:9px;background:var(--k-acc);color:#fff;font-weight:600;font-size:12px}

/* rings */
.k-rings{display:flex;gap:18px;align-items:center;color:var(--k-fg)}
.k-ring{display:grid;justify-items:center;gap:6px;font-size:11.5px;color:var(--k-fg2);text-align:center}
.k-ring .c{position:relative;width:92px;height:92px}
.k-ring .c b{position:absolute;inset:0;display:grid;place-items:center;font-size:19px;font-weight:600;color:var(--k-fg);font-variant-numeric:tabular-nums}
.k-ring .c b small{font-size:11px}
.k-ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.k-ring .tr{stroke:color-mix(in srgb,var(--k-fg) 8%,transparent)}
.k-ring .pr{stroke:var(--k-acc)}
.k-eta{font-size:12px;color:var(--k-ok);display:flex;gap:6px;align-items:center;margin-top:12px}

/* office */
.k-office svg{width:100%;height:auto}
.k-office .room{fill:var(--k-sub);stroke:var(--k-line)}
.k-office .lbl{font-size:10.5px;fill:var(--k-fg2);font-family:Geist,sans-serif}
.k-office .rb{fill:var(--k-fg)}
.k-office .eye{fill:var(--k-bg)}

/* chat */
.k-chat{display:grid;gap:8px;font-size:12.5px;color:var(--k-fg)}
.k-chat .u{justify-self:end;background:var(--k-acc);color:#fff;padding:8px 12px;border-radius:14px 14px 4px 14px;max-width:85%}
.k-chat .tool{justify-self:start;font-family:"Geist Mono",monospace;font-size:11px;color:var(--k-fg2);background:var(--k-sub);border:1px solid var(--k-line);padding:4px 8px;border-radius:8px;display:flex;gap:6px;align-items:center}
.k-chat .c{background:var(--k-bg);border:1px solid var(--k-line);padding:9px 12px;border-radius:14px 14px 14px 4px;max-width:92%;line-height:1.5;color:var(--k-fg)}

/* history */
.k-hist{display:flex;align-items:flex-end;gap:5px;height:110px}
.k-hist span{flex:1;border-radius:5px 5px 2px 2px;background:color-mix(in srgb,var(--k-acc) 28%,transparent)}
.k-hist span.t{background:var(--k-acc)}
.k-hist-x{display:flex;justify-content:space-between;font-size:10.5px;color:var(--k-fg3);margin-top:6px}

/* terminal */
.k-term{background:#0E0D1A;color:#E6E4F7;border-radius:16px;border:1px solid rgba(255,255,255,.08);font-family:"Geist Mono",monospace;font-size:12.5px;overflow:hidden}
.k-term .bar3{display:flex;gap:6px;padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.06)}
.k-term .bar3 i{width:10px;height:10px;border-radius:50%;background:#3A3850}
.k-term pre{padding:14px 16px;white-space:pre-wrap;line-height:1.7;font-family:inherit}
.k-term .pr{color:#8F82FF}.k-term .ok{color:#7CF0B6}.k-term .dm{color:#A6A2C6}

/* copy command */
.cmd{display:inline-flex;align-items:center;gap:10px;max-width:100%;font-family:"Geist Mono",monospace;font-size:13px;border-radius:99px;padding:6px 6px 6px 16px;cursor:pointer;transition:transform .5s var(--ease)}
.cmd:active{transform:scale(.98)}
.cmd .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd .ci{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;transition:transform .5s var(--ease)}
.cmd:hover .ci{transform:scale(1.06)}
.cmd .ci .ic{width:16px;height:16px}

/* install tabs (shared logic) */
.tabs{display:flex;gap:4px;padding:4px;border-radius:14px;width:max-content;max-width:100%;overflow-x:auto}
.tabs button{padding:8px 14px;border-radius:10px;font-weight:500;white-space:nowrap;transition:background .4s var(--ease),color .4s var(--ease)}
@media (max-width:600px){.tabs{flex-wrap:wrap;width:auto}}
.tpane{display:none}.tpane.on{display:block}
.steps{display:grid;gap:14px;counter-reset:s;margin-top:4px}
.steps li>span{min-width:0}.steps li{list-style:none;display:grid;grid-template-columns:28px 1fr;gap:12px;line-height:1.55}
.steps li::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600}
.codeline{margin-top:8px;display:flex;align-items:center;gap:8px;font-family:"Geist Mono",monospace;font-size:12.5px;padding:10px 10px 10px 14px;border-radius:12px;overflow:hidden}
.codeline span{flex:1;overflow-x:auto;white-space:nowrap}
.codeline button{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;flex:none}

/* faq */
.faq details{border-radius:16px;transition:background .4s var(--ease)}
.faq summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:16px;padding:18px 20px;font-weight:500;font-size:17px}
.faq summary::-webkit-details-marker{display:none}
.faq summary .pm{margin-left:auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;transition:transform .5s var(--ease)}
.faq details[open] summary .pm{transform:rotate(45deg)}
.faq details p{padding:0 20px 20px;line-height:1.65;max-width:760px}



.k-map g[data-node].on rect.node{stroke:var(--k-acc);stroke-width:2}
.k-map g[data-node] rect.node{transition:stroke .4s var(--ease)}
.k-map .det .f,.k-map .det .kv b{transition:opacity .3s}
.k-map .det.sw .f,.k-map .det.sw .kv b{opacity:0}

/* ===== nav ===== */

let REL=null;
function render(){
 document.documentElement.lang=L;
 document.querySelectorAll("[data-c]").forEach(el=>{const f=C[el.dataset.c];if(f){const keep=el.querySelector('[data-tab][aria-selected=true]')?.dataset.tab;el.innerHTML=f();if(keep)selectTab(el,keep)}});

 if(REL)document.querySelectorAll("[data-dmg]").forEach(a=>a.href=REL.url);
 const ht=document.getElementById("heroToast");ht.innerHTML=TOGGLE?C.toast2():C.toast();

function selectTab(root,name){root.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===name));root.querySelectorAll("[data-pane]").forEach(p=>p.classList.toggle("on",p.dataset.pane===name))}
try{L=localStorage.getItem("tk-lang")||((navigator.language||"").toLowerCase().startsWith("en")?"en":"uz")}catch(e){L=(navigator.language||"").toLowerCase().startsWith("en")?"en":"uz"}
fetch("https://api.github.com/repos/aliumirovux/TokenKuzat/releases/latest").then(r=>r.ok?r.json():null).then(j=>{if(!j)return;const a=(j.assets||[]).find(x=>/\.dmg$/.test(x.name));REL={tag:j.tag_name,url:a?a.browser_download_url:j.html_url};render()}).catch(()=>{});

/* live: step cycling across every map + panel */
function paintStep(anim){const st=t("steps")[STEP];
 document.querySelectorAll(".k-map").forEach(m=>{m.querySelectorAll("[data-node]").forEach(g=>g.classList.toggle("on",+g.dataset.node===STEP));m.querySelectorAll("[data-w]").forEach(w=>w.classList.toggle("live",+w.dataset.w===STEP));
  const d=m.querySelector(".det");const set=()=>{d.querySelector("[data-d=f]").textContent=st[0]+" · "+st[1];d.querySelector("[data-d=r]").textContent=st[2];d.querySelector("[data-d=c]").textContent=st[3];d.querySelector("[data-d=s]").textContent=st[4]};
  if(anim){d.classList.add("sw");setTimeout(()=>{set();d.classList.remove("sw")},300)}else set()});
 document.querySelectorAll("[data-pstep]").forEach(e=>e.innerHTML=`<code>${st[0]}</code>${st[1]}`);
 document.querySelectorAll("[data-pstep2]").forEach(e=>e.textContent=st[0]+" · "+st[1]);
}
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let TOGGLE=0;
if(!reduce){
 setInterval(()=>{STEP=(STEP+1)%4;paintStep(true)},2600);
 let today=1.28,rate=12.4;setInterval(()=>{rate=Math.max(6,Math.min(19,rate+(Math.random()-.45)*1.6));today+=rate/60/1000*3;document.querySelectorAll("[data-rate]").forEach(e=>e.textContent=n(rate.toFixed(1)));document.querySelectorAll("[data-today]").forEach(e=>e.textContent=n(today.toFixed(2)))},1500);
 const ht=document.getElementById("heroToast");
 const cyc=()=>{ht.innerHTML=TOGGLE?C.toast2():C.toast();ht.classList.add("in");setTimeout(()=>ht.classList.remove("in"),6500);TOGGLE^=1};
 setTimeout(()=>{cyc();setInterval(cyc,9000)},2200);
}else{document.getElementById("heroToast").classList.add("in")}

/* app window: auto-advance until the visitor clicks */
const PG=["bugun","xulosa","tarix","ofis"];let pgi=0,auto=!reduce,pgTimer;
function showPg(name){document.querySelectorAll(".stabs [data-pg]").forEach(b=>b.setAttribute("aria-selected",b.dataset.pg===name));document.querySelectorAll(".sframe img").forEach(p=>p.classList.toggle("on",p.dataset.p===name));const pr=document.querySelector(".stabs .prog span");pr.classList.remove("run");void pr.offsetWidth;if(auto)pr.classList.add("run")}
function tick(){pgi=(pgi+1)%PG.length;showPg(PG[pgi])}
if(auto){showPg("bugun");pgTimer=setInterval(tick,6000)}

document.addEventListener("click",e=>{
 const lg=e.target.closest("[data-setlang]");if(lg){L=lg.dataset.setlang;try{localStorage.setItem("tk-lang",L)}catch(_){ }render();return}
 const tb=e.target.closest("[data-tab]");if(tb){selectTab(tb.closest("[data-c]"),tb.dataset.tab);return}
 const pg=e.target.closest(".stabs [data-pg]");if(pg){auto=false;clearInterval(pgTimer);pgi=PG.indexOf(pg.dataset.pg);showPg(pg.dataset.pg);return}
 const cp=e.target.closest("[data-copy]");if(cp){const txt=cp.dataset.copy;const done=()=>{const lab=cp.querySelector(".tx");if(lab){const o=lab.textContent;lab.textContent=t("cta_copy");setTimeout(()=>lab.textContent=o,1400)}else{cp.style.color="#7CF0B6";setTimeout(()=>cp.style.color="",1200)}};(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(done).catch(()=>{const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(_){ }ta.remove();done()});return}
});
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{rootMargin:"0px 0px -8% 0px"});
render();document.querySelectorAll(".rev").forEach(el=>io.observe(el));
</script>
